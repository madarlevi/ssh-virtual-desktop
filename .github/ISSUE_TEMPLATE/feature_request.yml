name: Feature request
description: Describe a problem and a useful improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Platform, security or server requirements
