name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run versions:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run workflows:check
      - run: npm run repository:check
      - run: npm run test:ui
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis,msi --ci -- --locked
      - name: Verify installers and write checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe) + @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($installers.Count -lt 2) { throw 'Both NSIS and MSI installers are required.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installers | Copy-Item -Destination release-assets
          Get-ChildItem release-assets -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), [IO.Path]::GetFileName($_.Path) } | Set-Content release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's verified installer artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download $env:RUN_ID --name windows-installers --dir release-assets
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'--verify-tag','--title',$env:RELEASE_TAG,'--generate-notes')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          $releaseArgs += @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
