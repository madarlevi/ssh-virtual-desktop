[package]
name = "ssh-virtual-desktop"
version = "0.3.0"
license = "MIT"
description = "A local desktop for FreeBSD and Linux servers"
authors = ["Madár Levente (madarlevi)"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native"] }
rfd = { version = "0.17", default-features = false }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
